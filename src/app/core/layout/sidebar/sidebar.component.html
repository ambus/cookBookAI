<aside
  class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-screen sticky top-0 shadow-xl z-20"
>
  <div
    class="h-16 flex items-center px-6 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-sm"
  >
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20"
      >
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
          />
        </svg>
      </div>
      <h1
        class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent truncate tracking-tight"
      >
        cookBookAI
      </h1>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto py-6 flex flex-col gap-6">
    <div class="px-4">
      <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
        Menu główne
      </p>
      <ul class="space-y-1">
        <li>
          <a
            routerLink="/"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="bg-blue-600/10 text-blue-400 font-medium before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-blue-500 before:rounded-r-full shadow-sm"
            class="relative flex items-center px-3 py-2.5 text-sm font-normal rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200 group"
          >
            <svg
              class="w-5 h-5 mr-3 flex-shrink-0 transition-transform group-hover:scale-110"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            Pulpit
          </a>
        </li>
        <li>
          <a
            routerLink="/recipes"
            routerLinkActive="bg-blue-600/10 text-blue-400 font-medium before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-blue-500 before:rounded-r-full shadow-sm"
            class="relative flex items-center px-3 py-2.5 text-sm font-normal rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200 group"
          >
            <svg
              class="w-5 h-5 mr-3 flex-shrink-0 transition-transform group-hover:scale-110"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
            Przepisy
          </a>
        </li>
        <li>
          <a
            routerLink="/dinners"
            routerLinkActive="bg-blue-600/10 text-blue-400 font-medium before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-blue-500 before:rounded-r-full shadow-sm"
            class="relative flex items-center px-3 py-2.5 text-sm font-normal rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200 group"
          >
            <svg
              class="w-5 h-5 mr-3 flex-shrink-0 transition-transform group-hover:scale-110"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"
              />
            </svg>
            Obiady
          </a>
        </li>
      </ul>
    </div>

    <div class="px-4">
      <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
        Raportowanie
      </p>
      <ul class="space-y-1">
        <li>
          <a
            routerLink="/statistics"
            routerLinkActive="bg-blue-600/10 text-blue-400 font-medium before:absolute before:inset-y-0 before:left-0 before:w-1 before:bg-blue-500 before:rounded-r-full shadow-sm"
            class="relative flex items-center px-3 py-2.5 text-sm font-normal rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200 group"
          >
            <svg
              class="w-5 h-5 mr-3 flex-shrink-0 transition-transform group-hover:scale-110"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            Statystyki
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="p-4 border-t border-slate-800/80 bg-slate-900/50 backdrop-blur-sm">
    <div
      class="flex items-center gap-3 px-3 py-2 rounded-lg bg-slate-800/50 border border-slate-700/50"
    >
      <div
        class="h-2 w-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"
      ></div>
      <span class="text-xs font-medium text-slate-300">System online</span>
    </div>
  </div>
</aside>
