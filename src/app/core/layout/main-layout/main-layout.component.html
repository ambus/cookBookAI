<div
  class="min-h-screen bg-slate-950 flex text-slate-100 font-sans selection:bg-blue-500/30 selection:text-white"
>
  <!-- Desktop Sidebar -->
  <app-sidebar class="flex-shrink-0 z-20 hidden md:block" />

  <!-- Mobile Sidebar Overlay Backdrop -->
  @if (isMobileMenuOpen()) {
    <div
      class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-30 md:hidden"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>
  }

  <!-- Mobile Sidebar -->
  <div
    class="fixed inset-y-0 left-0 z-40 w-64 transform transition-transform duration-300 ease-in-out md:hidden flex flex-col shadow-2xl"
    [class.translate-x-0]="isMobileMenuOpen()"
    [class.-translate-x-full]="!isMobileMenuOpen()"
  >
    <app-sidebar class="flex-1 w-full" />
  </div>

  <div class="flex-1 flex flex-col min-w-0 bg-slate-950 relative">
    <app-header class="z-10" />
    <main class="flex-1 overflow-x-hidden overflow-y-auto w-full">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 md:px-8 py-8 h-full">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
