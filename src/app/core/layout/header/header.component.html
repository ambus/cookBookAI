<header
  class="h-16 px-4 sm:px-6 lg:px-8 bg-slate-800 border-b border-slate-700 flex items-center justify-between sticky top-0 z-10 transition-colors"
>
  <div class="flex-1"></div>

  <div class="ml-4 flex items-center gap-4">
    @if (user()) {
      <div class="flex items-center gap-3">
        <div class="hidden sm:block text-right">
          <div class="text-sm font-medium text-slate-200">
            {{ user()?.displayName || 'Użytkownik' }}
          </div>
          <div class="text-xs text-slate-400">{{ user()?.email }}</div>
        </div>
        <button
          type="button"
          class="relative flex rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-800 focus:ring-blue-500 transition-shadow hover:ring-1 hover:ring-slate-500"
        >
          <span class="sr-only">Otwórz menu użytkownika</span>
          @if (user()?.photoURL) {
            <img
              class="h-9 w-9 rounded-full object-cover border-2 border-slate-600"
              [src]="user()?.photoURL"
              alt="Avatar"
            />
          } @else {
            <div
              class="h-9 w-9 rounded-full bg-slate-700 items-center justify-center flex border-2 border-slate-600 text-slate-300 font-bold text-sm shadow-inner"
            >
              {{ userInitials() | uppercase }}
            </div>
          }
          <div
            class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-green-500 border-2 border-slate-800"
          ></div>
        </button>
      </div>
      <button
        (click)="logout()"
        class="ml-2 inline-flex items-center px-3 py-1.5 border border-slate-600 text-xs font-semibold rounded-lg text-slate-300 bg-slate-800 hover:bg-slate-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-800 focus:ring-blue-500 transition-colors"
      >
        <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        Wyloguj
      </button>
    }
  </div>
</header>
