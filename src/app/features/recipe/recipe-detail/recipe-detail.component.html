<div class="py-12 animate-in fade-in zoom-in duration-500 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
  <div class="mb-6 flex justify-between items-center">
    <a
      routerLink="/recipes"
      class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-blue-400 transition-colors"
    >
      <svg
        class="mr-2 w-5 h-5 shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        />
      </svg>
      Wróć do przepisów
    </a>

    @if (recipe$ | async; as recipe) {
      <div class="flex items-center space-x-3">
        <a
          [routerLink]="['/edit-recipe', recipe.id]"
          class="inline-flex items-center rounded-lg bg-blue-600/10 px-3 py-2 text-sm font-semibold text-blue-400 shadow-sm border border-blue-500/20 hover:bg-blue-600/20 hover:text-blue-300 transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
        >
          <svg class="-ml-0.5 mr-1.5 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            />
          </svg>
          Edytuj
        </a>
        <button
          (click)="deleteRecipe(recipe.id)"
          type="button"
          class="inline-flex items-center rounded-lg bg-red-600/10 px-3 py-2 text-sm font-semibold text-red-500 shadow-sm border border-red-500/20 hover:bg-red-600/20 hover:text-red-400 transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
        >
          <svg class="-ml-0.5 mr-1.5 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
          Usuń
        </button>
      </div>
    }
  </div>

  @if (recipe$ | async; as recipe) {
    <div
      class="bg-slate-800/80 backdrop-blur-sm rounded-2xl border border-slate-700/80 shadow-xl overflow-hidden"
    >
      <div class="p-8 sm:p-10">
        <!-- Category Badge -->
        <div class="mb-6">
          <span
            class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium border"
            [class]="getCategoryColor(recipe.category)"
          >
            {{ recipe.category }}
          </span>
        </div>

        <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-8 tracking-tight">
          {{ recipe.title }}
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
          <!-- Ingredients Section -->
          <div class="md:col-span-1 space-y-4">
            <h2 class="text-xl font-semibold text-slate-100 flex items-center">
              <svg
                class="w-5 h-5 mr-2 text-blue-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                />
              </svg>
              Składniki
            </h2>
            <div class="bg-slate-900/50 rounded-xl p-5 border border-slate-700/50">
              <p class="text-slate-300 whitespace-pre-wrap leading-relaxed">
                {{ recipe.ingredients }}
              </p>
            </div>
          </div>

          <!-- Instructions Section -->
          <div class="md:col-span-2 space-y-4">
            <h2 class="text-xl font-semibold text-slate-100 flex items-center">
              <svg
                class="w-5 h-5 mr-2 text-purple-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
                />
              </svg>
              Instrukcje
            </h2>
            <div class="bg-slate-900/50 rounded-xl p-6 border border-slate-700/50">
              <p class="text-slate-300 whitespace-pre-wrap leading-relaxed">
                {{ recipe.instructions }}
              </p>
            </div>
          </div>
        </div>

        @if (recipe.sourceUrl) {
          <div class="mt-10 pt-6 border-t border-slate-700/50">
            <h3 class="text-sm font-medium text-slate-400 mb-3">Źródło</h3>
            <a
              [href]="recipe.sourceUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center space-x-2 text-blue-400 hover:text-blue-300 transition-colors break-all"
            >
              <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
                />
              </svg>
              <span>{{ recipe.sourceUrl }}</span>
            </a>
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
    </div>
  }
</div>
